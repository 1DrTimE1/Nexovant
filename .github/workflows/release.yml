# Builds Nexovant.exe and publishes a GitHub Release when a version tag (e.g. v1.0.1) is pushed.
# The app's auto-updater downloads Nexovant.exe and checks it against Nexovant.exe.sha256.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish Nexovant.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:Version=$version -o out

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/Nexovant.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Nexovant.exe" | Out-File out/Nexovant.exe.sha256 -Encoding ascii -NoNewline

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/Nexovant.exe
            out/Nexovant.exe.sha256
