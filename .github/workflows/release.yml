# Builds NexovantSetup.exe and publishes a GitHub Release when a version tag (e.g. v1.1.0) is pushed.
# The app's auto-updater downloads NexovantSetup.exe, checks it against the SHA-256 digest GitHub
# reports for it, and runs it silently.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish app
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          dotnet publish Nexovant.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version -o out/app

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          & $iscc "/DAppVersion=$env:VERSION" installer/Nexovant.iss
          if ($LASTEXITCODE) { exit 1 }

      - name: Test install and uninstall
        shell: pwsh
        run: |
          # Wait only for the setup itself: -Wait would also wait for the Nexovant window the setup starts.
          $setup = Start-Process out/NexovantSetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $setup.WaitForExit(300000)) { throw "Setup timed out" }
          Start-Sleep 3
          Get-Process Nexovant -ErrorAction SilentlyContinue | Stop-Process -Force
          $app = "$env:LOCALAPPDATA\Programs\Nexovant"
          if (-not (Test-Path "$app\Nexovant.exe")) { throw "Nexovant.exe was not installed" }
          if (-not (Test-Path "$app\unins000.exe")) { throw "Uninstaller missing" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Nexovant.lnk")) { throw "Start menu shortcut missing" }
          $uninstall = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -PassThru
          if (-not $uninstall.WaitForExit(300000)) { throw "Uninstall timed out" }
          # The uninstaller hands over to a temporary copy of itself, so poll for the result.
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\Nexovant.exe"); $i++) { Start-Sleep 2 }
          if (Test-Path "$app\Nexovant.exe") { throw "Uninstall did not remove the app" }

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/NexovantSetup.exe
